name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: 17 }
          - { os: ubuntu-latest, java: 21 }
          - { os: windows-latest, java: 17 }
          - { os: macos-latest, java: 17 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Unit tests and jar
        run: ./gradlew :lint-rules:test :lint-rules:jar --no-daemon --console=plain
        shell: bash
      - name: Upload jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-target-lint-jar
          path: lint-rules/build/libs/*.jar

  sample-app:
    name: sample app reports the expected issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run Android Lint with the rule pack on the sample app
        run: ./gradlew -PwithSample :sample-app:lintDebug --no-daemon --console=plain
      - name: Assert exactly the expected findings
        run: |
          report=sample-app/build/reports/lint-results.txt
          cat "$report"
          for id in OnBackPressedOverride KeyCodeBackHandling EdgeToEdgeOptOut PredictiveBackOptOut FixedOrientationManifest FixedOrientationCode LargeScreenRestrictionsIgnored ContentCaptureEnabledDeprecated BackgroundActivityStartLegacyMode; do
            grep -q "\[$id from " "$report" || { echo "::error::missing $id"; exit 1; }
          done
          n=$(grep -c ' \[[A-Za-z]* from io.github.cosmichackerx' "$report")
          test "$n" = 10 || { echo "::error::expected 7 findings, got $n"; exit 1; }
          if grep -q 'ModernActivity\|Scene' "$report"; then echo "::error::false positive on the clean sample classes"; exit 1; fi

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.0
        with:
          fail-on: warning
          # on pull requests: only gaps the PR introduces (needs fetch-depth: 0 above)
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  claims:
    name: README claims (claims-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/claims-check@v0.3.0
