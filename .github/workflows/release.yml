name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: release gate (claims-check)
    uses: ./.github/workflows/release-gate.yml
  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -PreleaseVersion="$version" :lint-rules:test :lint-rules:jar --no-daemon --console=plain
          cd lint-rules/build/libs
          sha256sum android-target-lint-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lint-rules/build/libs/android-target-lint-*.jar lint-rules/build/libs/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Add the jar with lintChecks(files(...)); see the README."

  publish-github-packages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -PreleaseVersion="$version" :lint-rules:publishLintRulesPublicationToGitHubPackagesRepository --no-daemon --console=plain
